<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Local Journalism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --text-color: #333333;
            --bg-color: #F4F1EA;
            --doc-bg: #ffffff;
            --doc-border: #e0e0e0;
            --highlight: #C8102E;
        }

        body {
            font-family: 'Archivo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px; 
            box-sizing: border-box;
        }

        .donation-box {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--doc-bg);
            border: 1px solid var(--doc-border);
            border-top: 3px solid var(--highlight);
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.08);
            padding: 20px 25px;
            border-radius: 2px;
        }

        .donation-header {
            font-family: 'Archivo', sans-serif;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--highlight);
            margin-top: 0;
            margin-bottom: 12px;
        }

        .donation-text {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-color);
            margin: 0;
        }

        .donation-text a {
            color: var(--highlight);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid var(--highlight);
            transition: all 0.2s ease-in-out;
        }

        .donation-text a:hover {
            background-color: #fde8eb;
        }
    </style>
</head>
<body>

<div class="donation-box">
    <div class="donation-header">Support Journalism Like This</div>
    <p class="donation-text">
        "Uncovered" is just one example of how local news informs our communities and ensures transparency. Help us continue holding power accountable across Florida. Make a tax-deductible contribution to our Community News Fund <a href="/support" target="_top">here</a>.
    </p>
</div>

</body>
</html>
